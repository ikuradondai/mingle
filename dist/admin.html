<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf3" />
    <meta name="description" content="Mingle.Cards 利用状況管理画面" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Mingle.Cards | 利用状況</title>
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <main id="admin-app" class="admin-shell" aria-live="polite">
      <section id="login-view" class="login-view" aria-labelledby="login-title">
        <div class="brand-lockup"><span class="brand-mark" aria-hidden="true">✦</span><span>Mingle.Cards</span></div>
        <div class="login-card">
          <p class="eyebrow">ADMIN</p>
          <h1 id="login-title">利用状況を確認</h1>
          <p class="muted">管理者パスワードを入力してください。</p>
          <form id="login-form" novalidate>
            <label for="admin-password">パスワード</label>
            <input id="admin-password" name="password" type="password" autocomplete="current-password" required />
            <p id="login-message" class="status-message" role="alert" aria-live="assertive"></p>
            <button class="button primary" type="submit">ログイン</button>
          </form>
        </div>
      </section>

      <section id="dashboard-view" class="dashboard-view" hidden aria-labelledby="dashboard-title">
        <header class="topbar">
          <div class="brand-lockup"><span class="brand-mark" aria-hidden="true">✦</span><span>Mingle.Cards</span></div>
          <div class="topbar-actions"><button id="refresh-button" class="button subtle" type="button">更新</button><button id="logout-button" class="button link" type="button">ログアウト</button></div>
        </header>
        <div class="dashboard-content">
          <div class="dashboard-heading"><div><p class="eyebrow">ADMIN / ANALYTICS</p><h1 id="dashboard-title">利用状況</h1><p id="updated-at" class="muted">—</p></div><div id="data-status" class="status-chip" role="status">読み込み中</div></div>
          <nav class="range-tabs" aria-label="期間"><button class="range-button is-active" data-range="today" type="button">今日</button><button class="range-button" data-range="7d" type="button">7日</button><button class="range-button" data-range="30d" type="button">30日</button><button class="range-button" data-range="all" type="button">累計</button></nav>
          <p id="dashboard-message" class="status-message" role="alert" aria-live="polite"></p>
          <div class="summary-grid">
            <article class="summary-card"><span class="summary-label">ページビュー</span><strong id="page-views-total">—</strong><span class="summary-unit">PV</span></article>
            <article class="summary-card coral"><span class="summary-label">テーマ利用開始</span><strong id="theme-starts-total">—</strong><span class="summary-unit">回</span></article>
            <article class="summary-card"><span class="summary-label">6枚完走</span><strong id="round-completes-total">—</strong><span class="summary-unit">回</span></article>
            <article class="summary-card coral"><span class="summary-label">続行</span><strong id="round-continues-total">—</strong><span class="summary-unit">回</span></article>
            <article class="summary-card"><span class="summary-label">全40枚完走</span><strong id="session-completes-total">—</strong><span class="summary-unit">回</span></article>
          </div>
          <div class="analytics-grid">
            <article class="panel"><div class="panel-heading"><h2>ページ別</h2><span class="panel-note">PV</span></div><div id="pages-list" class="metric-list"><p class="empty-state">読み込み中…</p></div></article>
            <article class="panel"><div class="panel-heading"><h2>テーマ別</h2><span class="panel-note">回数</span></div><div id="themes-list" class="metric-table"><p class="empty-state">読み込み中…</p></div></article>
            <article class="panel daily-panel"><div class="panel-heading"><h2>日別の推移</h2><span id="timezone-label" class="panel-note">Asia/Tokyo</span></div><div id="daily-list" class="daily-table"><p class="empty-state">読み込み中…</p></div></article>
          </div>
          <section class="panel feedback-panel" aria-labelledby="feedback-title">
            <div class="panel-heading"><div><h2 id="feedback-title">フィードバック</h2><p id="feedback-note" class="panel-note feedback-note">選択期間の最新100件まで</p></div><span id="feedback-count" class="panel-note">—</span></div>
            <div id="feedback-list" class="feedback-list"><p class="empty-state">読み込み中…</p></div>
          </section>
          <p id="tracking-started" class="tracking-note"></p>
        </div>
      </section>
    </main>
    <script type="module" src="/admin.js"></script>
  </body>
</html>
