  <script>
    const root=document.querySelector('[data-carousel]'), slides=[...document.querySelectorAll('[data-slide]')], dots=[...document.querySelectorAll('[data-dot]')], pause=document.querySelector('[data-pause]'), reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
    const state={index:0,userPaused:false,hovered:false,focusWithin:false,hidden:document.hidden,touchStart:null}; let timer;
    const autoAllowed=()=>!state.userPaused&&!state.hovered&&!state.focusWithin&&!state.hidden&&!reduceMotion.matches;
    function syncTimer(){clearInterval(timer);timer=autoAllowed()?setInterval(()=>show(state.index+1),6500):undefined}
    function syncPause(){pause.textContent=state.userPaused?'▶':'Ⅱ';pause.setAttribute('aria-label',state.userPaused?'カルーセルを再生':'カルーセルを停止')}
    function show(n){state.index=(n+slides.length)%slides.length;slides.forEach((s,k)=>{const active=k===state.index;s.classList.toggle('is-active',active);s.setAttribute('aria-hidden',String(!active));s.inert=!active});dots.forEach((d,k)=>{const active=k===state.index;d.classList.toggle('active',active);d.setAttribute('aria-current',active?'true':'false')})}
    function move(delta){show(state.index+delta);syncTimer()}
    show(0);syncPause();syncTimer();
    pause.onclick=()=>{state.userPaused=!state.userPaused;syncPause();syncTimer()}; document.querySelector('[data-prev]').onclick=()=>move(-1); document.querySelector('[data-next]').onclick=()=>move(1); dots.forEach(d=>d.onclick=()=>{show(+d.dataset.dot);syncTimer()});
    root.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();move(e.key==='ArrowRight'?1:-1)}}; root.onfocusin=()=>{state.focusWithin=true;syncTimer()}; root.onfocusout=()=>requestAnimationFrame(()=>{state.focusWithin=root.matches(':focus-within');syncTimer()}); root.onmouseenter=()=>{state.hovered=true;syncTimer()}; root.onmouseleave=()=>{state.hovered=false;syncTimer()};
    root.ontouchstart=e=>{state.touchStart=e.changedTouches[0].clientX}; root.ontouchend=e=>{if(state.touchStart!==null&&Math.abs(e.changedTouches[0].clientX-state.touchStart)>40)move(e.changedTouches[0].clientX<state.touchStart?1:-1);state.touchStart=null}; document.addEventListener('visibilitychange',()=>{state.hidden=document.hidden;syncTimer()}); reduceMotion.addEventListener?.('change',syncTimer);
  </script>
